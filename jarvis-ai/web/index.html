<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000508;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:#fff}

#bg-canvas,#orb-canvas,#ui{position:fixed;inset:0;width:100%;height:100%}
#bg-canvas {z-index:1}
#orb-canvas{z-index:2;pointer-events:none}
#ui        {z-index:3;pointer-events:none}

/* Header */
#header{position:absolute;top:28px;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;
  user-select:none;pointer-events:none}
#agent-name{font-size:12px;font-weight:700;letter-spacing:.35em;
  text-transform:uppercase;color:rgba(255,255,255,.88)}
#agent-tagline{font-size:10px;letter-spacing:.1em;
  color:rgba(255,255,255,.28);margin-top:5px;max-width:380px;text-align:center}
#status-dot{width:5px;height:5px;border-radius:50%;
  background:var(--acc,#00ff88);margin-top:10px;
  box-shadow:0 0 6px var(--acc,#00ff88);
  animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
#status-text{font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--acc,#00ff88);margin-top:6px;opacity:.65}

/* Agent labels */
#label-layer{position:absolute;inset:0;pointer-events:none}
.alabel{position:absolute;transform:translateX(-50%);
  text-align:center;opacity:0;pointer-events:auto;cursor:default;transition:opacity .4s}
.alabel .aname{font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap}
.alabel .aspec{font-size:8px;color:rgba(255,255,255,.38);white-space:nowrap;margin-top:2px}
.alabel.working .aname{animation:lpulse 1.1s ease-in-out infinite}
@keyframes lpulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:600px){.alabel{display:none}}

/* Chat area */
#chat-area{position:absolute;bottom:0;left:0;right:0;
  padding:20px 24px 24px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
#messages{display:flex;flex-direction:column;gap:7px;
  max-height:190px;overflow-y:auto;scrollbar-width:none}
#messages::-webkit-scrollbar{display:none}
.msg{padding:9px 13px;border-radius:12px;font-size:13px;
  line-height:1.5;max-width:560px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{background:rgba(255,255,255,.07);color:rgba(255,255,255,.88);
  align-self:flex-end;border:1px solid rgba(255,255,255,.07)}
.msg.jarvis{background:rgba(0,255,136,.05);color:rgba(255,255,255,.82);
  align-self:flex-start;border:1px solid rgba(0,255,136,.1)}
#input-row{display:flex;gap:8px;align-items:center;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:13px;padding:4px 4px 4px 14px;backdrop-filter:blur(24px)}
#chat-in{flex:1;background:none;border:none;outline:none;
  color:#fff;font-size:13px;font-family:inherit;padding:8px 0}
#chat-in::placeholder{color:rgba(255,255,255,.22)}
#voice-btn,#send-btn{width:34px;height:34px;border-radius:9px;border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;transition:all .18s}
#voice-btn{background:rgba(255,255,255,.05);color:rgba(255,255,255,.45)}
#voice-btn.active{background:rgba(255,170,0,.18);color:#ffaa00}
#send-btn{background:rgba(0,255,136,.12);color:#00ff88}
#send-btn:hover{background:rgba(0,255,136,.22)}

/* Notices */
#notices{position:absolute;top:110px;right:20px;
  display:flex;flex-direction:column;gap:7px;max-width:260px;pointer-events:auto}
.notice{background:rgba(0,5,15,.7);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.07);border-radius:11px;
  padding:11px 13px;font-size:11px;cursor:pointer;animation:fadein .3s ease}
.notice.high{border-left:3px solid #00ff88}
.notice.critical{border-left:3px solid #ff4444}
.ntitle{font-weight:600;color:rgba(255,255,255,.85)}
.nbody{color:rgba(255,255,255,.42);margin-top:3px;line-height:1.4}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="orb-canvas"></canvas>

<div id="ui">
  <div id="header">
    <div id="agent-name">JARVIS</div>
    <div id="agent-tagline">A personal AI that watches your investments and business pipeline</div>
    <div id="status-dot"></div>
    <div id="status-text">READY</div>
  </div>
  <div id="notices"></div>
  <div id="label-layer"></div>
  <div id="chat-area">
    <div id="messages"></div>
    <div id="input-row">
      <input id="chat-in" type="text" placeholder="Ask Jarvis anything…" autocomplete="off" spellcheck="false">
      <button id="voice-btn" title="Hold to speak">🎤</button>
      <button id="send-btn" title="Send">↑</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CONFIG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const isMobile = innerWidth < 600;

const AGENTS = [
  { id:'portfolio', name:'Portfolio Monitor', spec:'IBKR · Binance · Bitget',
    color:0x00ccff, orbit:{ r:2.75, spd:0.37, tilt:0.28,  phase:0    } },
  { id:'market',    name:'Market Intel',      spec:'Prices & alerts',
    color:0xffaa00, orbit:{ r:3.05, spd:0.24, tilt:-0.44, phase:2.09 } },
  { id:'pipeline',  name:'Deal Pipeline',     spec:'Deals & next actions',
    color:0xaa44ff, orbit:{ r:2.90, spd:0.31, tilt:0.52,  phase:4.19 } },
];

const STATES = {
  idle:       { col:0x00ff88, bright:0.42, nSpd:0.22, nMag:0.13, halo:1.55, haloI:0.25, rings:0.00, rot:0.11 },
  listening:  { col:0xffaa00, bright:0.95, nSpd:0.36, nMag:0.20, halo:1.78, haloI:0.62, rings:0.00, rot:0.17 },
  processing: { col:0x44aaff, bright:0.62, nSpd:0.80, nMag:0.25, halo:1.65, haloI:0.44, rings:0.85, rot:0.34 },
  speaking:   { col:0x00ff88, bright:1.00, nSpd:0.62, nMag:0.30, halo:1.82, haloI:0.68, rings:0.00, rot:0.24 },
  error:      { col:0xff3333, bright:0.68, nSpd:0.07, nMag:0.05, halo:1.50, haloI:0.32, rings:0.00, rot:0.03 },
  briefing:   { col:0x8844ff, bright:0.75, nSpd:0.28, nMag:0.17, halo:1.70, haloI:0.50, rings:0.00, rot:0.14 },
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SIMPLEX 3D NOISE (Ian McEwan / Stefan Gustavson)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const NOISE_GLSL = `
vec3 _m289v3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 _m289v4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 _perm(vec4 x){return _m289v4(((x*34.)+1.)*x);}
vec4 _tisq(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=_m289v3(i);
  vec4 p=_perm(_perm(_perm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=_tisq(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}
`;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDERERS + SCENES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const bgR = new THREE.WebGLRenderer({ canvas:document.getElementById('bg-canvas'), antialias:false });
bgR.setPixelRatio(Math.min(devicePixelRatio, 1.5));
bgR.setSize(innerWidth, innerHeight);
bgR.setClearColor(0x000508);

const orbR = new THREE.WebGLRenderer({ canvas:document.getElementById('orb-canvas'), antialias:true, alpha:true });
orbR.setPixelRatio(Math.min(devicePixelRatio, 2));
orbR.setSize(innerWidth, innerHeight);
orbR.setClearColor(0x000000, 0);

const bgScene = new THREE.Scene();
const bgCam   = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
bgCam.position.z = 5;

const orbScene = new THREE.Scene();
const orbCam   = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
orbCam.position.z = 4;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BACKGROUND — STARS (two layers, twinkling)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function makeStars(count, ptSize, spread, alphaRange) {
  const pos = new Float32Array(count * 3);
  const opa = new Float32Array(count);
  const ph  = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const th = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = spread * (.5 + Math.random() * .5);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(phi) - spread * .35;
    opa[i] = alphaRange[0] + Math.random() * (alphaRange[1] - alphaRange[0]);
    ph[i]  = Math.random() * Math.PI * 2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOpa',     new THREE.BufferAttribute(opa, 1));
  geo.setAttribute('aPh',      new THREE.BufferAttribute(ph,  1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ uTime:{value:0} },
    vertexShader:`
      attribute float aOpa,aPh; uniform float uTime; varying float vA;
      void main(){
        vA=aOpa*(sin(uTime*1.3+aPh)*.22+.78);
        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=${ptSize.toFixed(1)}*(280.0/-mv.z);
        gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`
      varying float vA;
      void main(){
        float d=distance(gl_PointCoord,vec2(.5));
        if(d>.5)discard;
        gl_FragColor=vec4(1.,1.,1.,(1.-d*2.)*vA);}`,
  });
  return { pts: new THREE.Points(geo, mat), mat };
}

const starA = makeStars(isMobile?600:1200, 1.1, 90, [.22,.72]);
const starB = makeStars(isMobile?180:380,  2.3, 80, [.5, 1.0]);
bgScene.add(starA.pts, starB.pts);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BACKGROUND — NEBULA CLOUDS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const nebMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0} },
  vertexShader:`varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    ${NOISE_GLSL}
    uniform float uTime; varying vec2 vU;
    void main(){
      vec2 u=vU*2.-1.;
      float n1=snoise(vec3(u*1.1,uTime*.034))*.5+.5;
      float n2=snoise(vec3(u*1.9+vec2(1.8,-.7),uTime*.026))*.5+.5;
      float n3=snoise(vec3(u*3.3-vec2(.5,1.1),uTime*.041))*.5+.5;
      float edge=1.-smoothstep(.35,1.,length(u));
      vec3 c=vec3(0.,.33,.24)*n1*n1+vec3(0.,.14,.34)*n2*n2+vec3(.12,0.,.17)*n3;
      gl_FragColor=vec4(c,length(c)*edge*.30);}`,
});
const nebPlane = new THREE.Mesh(new THREE.PlaneGeometry(36,24), nebMat);
nebPlane.position.z = -12;
bgScene.add(nebPlane);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BACKGROUND — ORB GLOW POOL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const poolMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uCol:{value:new THREE.Color(0x00ff88)}, uI:{value:.4} },
  vertexShader:`varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform vec3 uCol; uniform float uI; varying vec2 vU;
    void main(){
      float d=length(vU-.5);
      float a=pow(smoothstep(.5,0.,d),1.7)*uI;
      gl_FragColor=vec4(uCol*.75,a);}`,
});
const poolPlane = new THREE.Mesh(new THREE.PlaneGeometry(10,10), poolMat);
poolPlane.position.z = -2.5;
bgScene.add(poolPlane);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BACKGROUND — DISTANT NODE WEB
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const webGroup = new THREE.Group();
const NC = isMobile ? 45 : 90;
const nodes = Array.from({length:NC}, () => ({
  x:(Math.random()-.5)*32, y:(Math.random()-.5)*22, z:-22-Math.random()*20
}));
(()=>{
  const np = new Float32Array(NC*3);
  nodes.forEach((n,i)=>{ np[i*3]=n.x; np[i*3+1]=n.y; np[i*3+2]=n.z; });
  const ngeo = new THREE.BufferGeometry();
  ngeo.setAttribute('position', new THREE.BufferAttribute(np,3));
  webGroup.add(new THREE.Points(ngeo,
    new THREE.PointsMaterial({color:0x003355,size:.14,transparent:true,opacity:.55})));

  const lp = [];
  for(let i=0;i<NC;i++) for(let j=i+1;j<NC;j++){
    if(Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y,nodes[i].z-nodes[j].z)<8)
      lp.push(nodes[i].x,nodes[i].y,nodes[i].z,nodes[j].x,nodes[j].y,nodes[j].z);
  }
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lp),3));
  webGroup.add(new THREE.LineSegments(lgeo,
    new THREE.LineBasicMaterial({color:0x002244,transparent:true,opacity:.18})));

  const DC = isMobile?80:200, dp = new Float32Array(DC*3);
  for(let i=0;i<DC;i++){dp[i*3]=(Math.random()-.5)*44;dp[i*3+1]=(Math.random()-.5)*32;dp[i*3+2]=-18-Math.random()*24;}
  const dgeo = new THREE.BufferGeometry();
  dgeo.setAttribute('position', new THREE.BufferAttribute(dp,3));
  webGroup.add(new THREE.Points(dgeo,
    new THREE.PointsMaterial({color:0x001833,size:.05,transparent:true,opacity:.32})));
})();
bgScene.add(webGroup);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ORB — WIREFRAME ICOSAHEDRON WITH NOISE + FRESNEL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const orbMat = new THREE.ShaderMaterial({
  transparent:true, wireframe:true, depthWrite:false,
  uniforms:{
    uTime:{value:0}, uCol:{value:new THREE.Color(0x00ff88)},
    uBright:{value:.42}, uNSpd:{value:.22}, uNMag:{value:.13},
    uLoud:{value:0}, uBass:{value:0},
  },
  vertexShader:`
    ${NOISE_GLSL}
    uniform float uTime,uNSpd,uNMag,uLoud,uBass;
    varying float vF,vD;
    void main(){
      vec3 p=position;
      float n1=snoise(p*1.5+uTime*uNSpd)*.55;
      float n2=snoise(p*3.1-uTime*uNSpd*.7)*.30;
      float n3=snoise(p*6.2+uTime*uNSpd*.5)*.15;
      float d=(n1+n2+n3)*uNMag;
      d+=uBass*.11*snoise(p*8.+uTime*2.2);
      d+=uLoud*.07;
      p+=normal*d; vD=d;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      vec3 nd=normalize(normalMatrix*normal);
      vec3 vd=normalize(-mv.xyz);
      vF=pow(clamp(1.-abs(dot(vd,nd)),0.,1.),1.9);
      gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`
    uniform vec3 uCol; uniform float uBright;
    varying float vF,vD;
    void main(){
      float a=(vF*.88+.07)*uBright;
      vec3 c=uCol*(.3+vF*.95+vD*.4);
      gl_FragColor=vec4(c,a);}`,
});
const orbMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,4), orbMat);
orbScene.add(orbMesh);

// Glow shell — BackSide sphere gives a soft halo rim
