<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'SF Mono', 'Fira Code', monospace; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 24px; border-bottom: 1px solid #1e1e2e; display: flex; align-items: center; gap: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff88; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  header h1 { font-size: 18px; color: #fff; letter-spacing: 2px; }
  header span { font-size: 12px; color: #555; margin-left: auto; }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1a1a2e; border: 1px solid #2a2a4e; color: #a0a0ff; }
  .msg.jarvis { align-self: flex-start; background: #0d1a0d; border: 1px solid #1a3a1a; color: #e0e0e0; }
  .msg.jarvis strong { color: #00ff88; }
  .msg.system { align-self: center; color: #444; font-size: 12px; padding: 4px 8px; }
  #input-area { padding: 16px 24px; border-top: 1px solid #1e1e2e; display: flex; gap: 12px; }
  #input { flex: 1; background: #111; border: 1px solid #2a2a2a; color: #e0e0e0; padding: 12px 16px; border-radius: 6px; font-family: inherit; font-size: 14px; outline: none; }
  #input:focus { border-color: #00ff88; }
  #send { background: #00ff88; color: #000; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 14px; }
  #send:hover { background: #00cc66; }
  #send:disabled { background: #333; color: #666; cursor: not-allowed; }
  .quick-btns { padding: 0 24px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .quick-btn { background: #111; border: 1px solid #2a2a2a; color: #888; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .quick-btn:hover { border-color: #00ff88; color: #00ff88; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0a0a0f; } ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>JARVIS</h1>
  <span id="status">connecting...</span>
</header>

<div class="quick-btns">
  <button class="quick-btn" onclick="send('Give me my portfolio summary')">Portfolio</button>
  <button class="quick-btn" onclick="send('Run morning briefing')">Morning Briefing</button>
  <button class="quick-btn" onclick="send('What are my open orders?')">Open Orders</button>
  <button class="quick-btn" onclick="send('Show me my crypto balances')">Crypto</button>
  <button class="quick-btn" onclick="send('Show me my deal pipeline')">Deals</button>
  <button class="quick-btn" onclick="send('What should I focus on today?')">Focus</button>
</div>

<div id="messages">
  <div class="msg system">Jarvis is ready. Ask anything.</div>
</div>

<div id="input-area">
  <input id="input" placeholder="Ask Jarvis anything..." autofocus />
  <button id="send" onclick="send()">Send</button>
</div>

<script>
let ws = null;
let currentMsg = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);

  ws.onopen = () => {
    document.getElementById('status').textContent = 'online';
    document.getElementById('status').style.color = '#00ff88';
  };

  ws.onmessage = (e) => {
    if (e.data === '[DONE]') {
      currentMsg = null;
      document.getElementById('send').disabled = false;
      document.getElementById('input').disabled = false;
      document.getElementById('input').focus();
      return;
    }
    if (!currentMsg) {
      currentMsg = addMessage('', 'jarvis');
    }
    currentMsg.textContent += e.data;
    scrollBottom();
  };

  ws.onclose = () => {
    document.getElementById('status').textContent = 'reconnecting...';
    document.getElementById('status').style.color = '#ff6666';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return div;
}

function scrollBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function send(text) {
  const input = document.getElementById('input');
  const msg = text || input.value.trim();
  if (!msg || !ws || ws.readyState !== WebSocket.OPEN) return;

  addMessage(msg, 'user');
  ws.send(msg);
  input.value = '';
  document.getElementById('send').disabled = true;
  document.getElementById('input').disabled = true;
}

document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

connect();
</script>
</body>
</html>
